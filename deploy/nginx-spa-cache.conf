# Include in the MMIS HTTPS server block so browsers always pick up new frontend builds.
# Hashed /assets/* may stay cached for a year; HTML must revalidate every time.

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
